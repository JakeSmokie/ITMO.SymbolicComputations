<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="/lab/">
  <title>Symbolic Workbench · C# WebAssembly</title>
</head>
<body>
  <main>
    <h1>Symbolic Workbench</h1>
    <p id="runtime-status" role="status">Загрузка C# WebAssembly…</p>
    <p>Этот минимальный хост проверяет загрузку движка. Полный интерфейс подключается к symbolicTransport.</p>
    <pre id="smoke-result"></pre>
  </main>
  <script src="symbolic-transport.js"></script>
  <script>
    (async () => {
      const status = document.getElementById("runtime-status");
      try {
        const health = await window.symbolicReady;
        status.textContent = health.engine;
        const response = await window.symbolicTransport("/api/evaluate", {
          method: "POST", body: JSON.stringify({ expression: "(2 + 3)^2 / 5" })
        });
        const data = await response.json();
        document.getElementById("smoke-result").textContent = JSON.stringify({ status: response.status, result: data.result }, null, 2);
      } catch (error) {
        status.textContent = "Ошибка загрузки: " + error.message;
      }
    })();
  </script>
</body>
</html>
